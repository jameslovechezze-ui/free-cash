<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Cash</title>

    <style>
        body {
            margin: 0;
            background: #e8e8e8;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 25px #888;
        }

        h1 {
            color: #159447;
        }

        .money {
            font-size: 64px;
            font-weight: bold;
            margin: 25px 0;
        }

        button {
            background: #159447;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 16px 35px;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #0d7134;
        }

        .small {
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>FREE CASH</h1>

    <p>Congratulations!</p>

    <p>You have been selected to receive:</p>

    <div class="money">$500</div>

    <button onclick="claim()">
        CLAIM $500
    </button>

    <p class="small">
        No payment required.
    </p>

</div>

<script>
function claim() {
    window.location.href = "ransom.html";
}
</script>

</body>
</html>
