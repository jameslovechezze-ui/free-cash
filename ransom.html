<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RANSOM — Intro</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

/* =====================================================
   CLAIM SCREEN
===================================================== */

#claimScreen {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center, #252525 0%, #090909 55%, #000 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.claimBox {
    text-align: center;
}

.claimBox h1 {
    font-size: clamp(35px, 7vw, 75px);
    margin: 0 0 15px;
    letter-spacing: 5px;
}

.claimBox p {
    color: #aaa;
    margin-bottom: 35px;
}

#claimButton {
    border: 2px solid #45ff72;
    background: #0b3218;
    color: #69ff8b;
    font-size: 25px;
    font-weight: bold;
    padding: 20px 45px;
    border-radius: 7px;
    cursor: pointer;
    transition: .15s;
}

#claimButton:hover {
    background: #17652c;
    transform: scale(1.05);
}

/* =====================================================
   CINEMATIC
===================================================== */

#cinematic {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    overflow: hidden;
    z-index: 900;
}

/* =====================================================
   PHASE 1
===================================================== */

#phase1 {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(420px, 55vw);
    height: min(420px, 55vw);
    object-fit: contain;

    transform: translate(-50%, -50%);

    opacity: 0;

    filter: contrast(1.1);

    transition:
        opacity 1s ease;
}

/* =====================================================
   RED / BLACK BACKGROUND
===================================================== */

#redBackground {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(150, 0, 0, .65),
            #090000 55%,
            #000 100%
        );

    opacity: 0;

    transition: opacity 1s;
}

/* =====================================================
   PHASE 2
===================================================== */

#phase2Container {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    opacity: 0;

    transform: scale(0.65);

    z-index: 5;
}

#phase2 {
    width: min(500px, 65vw);
    height: min(500px, 65vw);

    object-fit: contain;

    filter:
        contrast(1.5)
        brightness(1.15);

    transition:
        transform 4s cubic-bezier(.15,.7,.15,1);
}

/* =====================================================
   WINDOWS / ARG GLITCH EFFECT
===================================================== */

.glitchLayer {
    position: absolute;
    inset: 0;

    pointer-events: none;

    opacity: 0;
    z-index: 20;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 4px,
            rgba(255,255,255,.08) 5px,
            transparent 6px
        );

    mix-blend-mode: screen;
}

#glitchRed {
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 8px,
            rgba(255,0,0,.45) 9px,
            transparent 11px
        );

    mix-blend-mode: screen;
}

#glitchWhite {
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 17px,
            rgba(255,255,255,.12) 18px,
            transparent 22px
        );
}

/* Main corruption animation */

.corrupted {
    animation:
        corruptShake .09s infinite,
        corruptColor .16s infinite;
}

@keyframes corruptShake {

    0% {
        transform:
            translate(-4px, 2px)
            skewX(-2deg);
    }

    20% {
        transform:
            translate(5px, -2px)
            skewX(3deg);
    }

    40% {
        transform:
            translate(-7px, 0)
            skewX(-4deg);
    }

    60% {
        transform:
            translate(3px, 4px)
            skewX(2deg);
    }

    80% {
        transform:
            translate(-2px, -4px)
            skewX(-1deg);
    }

    100% {
        transform:
            translate(4px, 1px)
            skewX(3deg);
    }
}

@keyframes corruptColor {

    0% {
        filter:
            contrast(1.5)
            brightness(1.2)
            drop-shadow(8px 0 red)
            drop-shadow(-8px 0 cyan);
    }

    50% {
        filter:
            contrast(2)
            brightness(.8)
            drop-shadow(-10px 0 red)
            drop-shadow(10px 0 cyan);
    }

    100% {
        filter:
            contrast(1.6)
            brightness(1.3)
            drop-shadow(5px 0 cyan)
            drop-shadow(-5px 0 red);
    }
}

/* =====================================================
   RANDOM ARG GLITCH BLOCKS
===================================================== */

.glitchBlock {
    position: absolute;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 30;
}

/* =====================================================
   DOWNLOAD SCREEN
===================================================== */

#downloadScreen {
    position: absolute;
    inset: 0;

    background: #000;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    z-index: 50;
}

.downloadLogo {
    width: 100px;
    height: 100px;

    border: 7px solid #ddd;
    border-radius: 50%;

    position: relative;

    margin-bottom: 35px;

    animation:
        downloadSpin .7s linear infinite;
}

.downloadLogo::before {
    content: "";

    position: absolute;

    width: 30px;
    height: 7px;

    background: #ddd;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);
}

.downloadLogo::after {
    content: "";

    position: absolute;

    width: 30px;
    height: 30px;

    border-left: 7px solid #ddd;
    border-bottom: 7px solid #ddd;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -30%)
        rotate(-45deg);
}

@keyframes downloadSpin {
    to {
        transform: rotate(360deg);
    }
}

#downloadText {
    font-family: monospace;
    font-size: 22px;
    color: #ddd;
}

.downloadBar {
    width: min(600px, 75vw);
    height: 15px;

    margin-top: 20px;

    background: #222;

    border: 1px solid #555;
}

#downloadProgress {
    width: 0%;
    height: 100%;

    background: #e60000;

    transition: width .08s linear;
}

/* =====================================================
   ENCRYPTED WARNING
===================================================== */

#encryptedScreen {
    position: absolute;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    background: #050000;

    z-index: 100;
}

#encryptedText {
    font-size: clamp(30px, 7vw, 80px);

    font-weight: 900;

    text-align: center;

    color: #fff;

    text-shadow:
        0 0 10px red,
        0 0 30px red;

    animation:
        warningFlash .12s infinite;
}

@keyframes warningFlash {

    0% {
        opacity: 1;
    }

    50% {
        opacity: .35;
    }

    100% {
        opacity: 1;
    }
}

/* =====================================================
   FLASH
===================================================== */

#redFlash {
    position: absolute;
    inset: 0;

    background: red;

    opacity: 0;

    z-index: 150;

    pointer-events: none;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    #phase1 {
        width: 70vw;
        height: 70vw;
    }

    #phase2 {
        width: 75vw;
        height: 75vw;
    }

}
</style>
</head>

<body>


<!-- =====================================================
     CLAIM SCREEN
===================================================== -->

<div id="claimScreen">

    <div class="claimBox">

        <h1>$500</h1>

        <p>
            A reward is waiting for you.
        </p>

        <button id="claimButton">
            CLAIM $500
        </button>

    </div>

</div>


<!-- =====================================================
     CINEMATIC
===================================================== -->

<div id="cinematic">

    <div id="redBackground"></div>

    <!-- PHASE 1 -->

    <img
        id="phase1"
        src="https://raw.githubusercontent.com/jameslovechezze-ui/free-cash/main/ransom1.jpg"
        alt=""
    >


    <!-- PHASE 2 -->

    <div id="phase2Container">

        <img
            id="phase2"
            src="https://raw.githubusercontent.com/jameslovechezze-ui/free-cash/main/ransom2.jpg"
            alt=""
        >

    </div>


    <!-- ARG GLITCH -->

    <div
        class="glitchLayer"
        id="glitchLayer"
    ></div>

    <div
        class="glitchLayer"
        id="glitchRed"
    ></div>

    <div
        class="glitchLayer"
        id="glitchWhite"
    ></div>


    <!-- RANDOM GLITCH PIECES -->

    <div class="glitchBlock" id="gb1"></div>
    <div class="glitchBlock" id="gb2"></div>
    <div class="glitchBlock" id="gb3"></div>
    <div class="glitchBlock" id="gb4"></div>
    <div class="glitchBlock" id="gb5"></div>


    <!-- DOWNLOAD -->

    <div id="downloadScreen">

        <div class="downloadLogo"></div>

        <div id="downloadText">
            ENCRYPTING SYSTEM...
        </div>

        <div class="downloadBar">

            <div id="downloadProgress"></div>

        </div>

    </div>


    <!-- ENCRYPTED -->

    <div id="encryptedScreen">

        <div id="encryptedText">
            YOU HAVE BEEN ENCRYPTED.
        </div>

    </div>


    <div id="redFlash"></div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const claimScreen =
    document.getElementById("claimScreen");

const claimButton =
    document.getElementById("claimButton");

const cinematic =
    document.getElementById("cinematic");

const phase1 =
    document.getElementById("phase1");

const redBackground =
    document.getElementById("redBackground");

const phase2Container =
    document.getElementById("phase2Container");

const phase2 =
    document.getElementById("phase2");

const glitchLayer =
    document.getElementById("glitchLayer");

const glitchRed =
    document.getElementById("glitchRed");

const glitchWhite =
    document.getElementById("glitchWhite");

const downloadScreen =
    document.getElementById("downloadScreen");

const downloadProgress =
    document.getElementById("downloadProgress");

const encryptedScreen =
    document.getElementById("encryptedScreen");

const redFlash =
    document.getElementById("redFlash");


/* =====================================================
   START INTRO
===================================================== */

claimButton.addEventListener(
    "click",
    startIntro
);


function startIntro(){

    claimScreen.style.display =
        "none";

    cinematic.style.display =
        "block";


    /*
        PHASE 1
        Pitch black.
    */

    phase1.style.opacity =
        "1";


    setTimeout(
        phase1Transition,
        2200
    );

}


/* =====================================================
   PHASE 1 → RED
===================================================== */

function phase1Transition(){

    /*
        Background begins turning
        black/red.
    */

    redBackground.style.opacity =
        "1";


    /*
        Phase 1 disappears.
    */

    phase1.style.opacity =
        "0";


    setTimeout(
        showPhase2,
        800
    );

}


/* =====================================================
   PHASE 2 CORRUPTION
===================================================== */

function showPhase2(){

    phase2Container.style.opacity =
        "1";


    /*
        Start heavily distorted.
    */

    phase2.classList.add(
        "corrupted"
    );


    /*
        Windows ARG style
        corruption.
    */

    glitchLayer.style.opacity =
        ".9";

    glitchRed.style.opacity =
        ".7";

    glitchWhite.style.opacity =
        ".5";


    startRandomGlitches();


    /*
        Let the corruption happen
        for a short time.
    */

    setTimeout(
        stabilizePhase2,
        1800
    );

}


/* =====================================================
   STABILIZE → APPROACH
===================================================== */

function stabilizePhase2(){

    phase2.classList.remove(
        "corrupted"
    );


    glitchLayer.style.opacity =
        ".15";

    glitchRed.style.opacity =
        ".12";

    glitchWhite.style.opacity =
        ".08";


    stopRandomGlitches();


    /*
        NOW PHASE 2 STARTS
        COMING TOWARD THE PLAYER.
    */

    setTimeout(
        phase2Approach,
        300
    );

}


/* =====================================================
   PHASE 2 APPROACH
===================================================== */

function phase2Approach(){

    /*
        Face grows massively,
        like it is moving toward
        the screen.
    */

    phase2.style.transform =
        "scale(6)";


    /*
        Darken everything around
        the face.
    */

    setTimeout(
        removePhase2,
        3800
    );

}


/* =====================================================
   REMOVE FACE
===================================================== */

function removePhase2(){

    phase2Container.style.opacity =
        "0";


    /*
        Immediately transition
        to fake download.
    */

    setTimeout(
        startDownload,
        500
    );

}


/* =====================================================
   DOWNLOAD
===================================================== */

function startDownload(){

    downloadScreen.style.display =
        "flex";


    let progress = 0;


    /*
        VERY FAST download.
    */

    const download =
        setInterval(
            ()=>{

                progress +=
                    Math.random() * 9 + 6;


                if(progress >= 100){

                    progress = 100;

                    clearInterval(
                        download
                    );


                    downloadProgress.style.width =
                        "100%";


                    setTimeout(
                        encryptionWarning,
                        250
                    );

                }


                downloadProgress.style.width =
                    progress + "%";

            },
            80
        );

}


/* =====================================================
   ENCRYPTION WARNING
===================================================== */

function encryptionWarning(){

    downloadScreen.style.display =
        "none";


    encryptedScreen.style.display =
        "flex";


    /*
        Red screen flash.
    */

    redFlash.style.opacity =
        "1";


    setTimeout(
        ()=>{
            redFlash.style.opacity =
                "0";
        },
        100
    );


    /*
        Warning stays briefly.
    */

    setTimeout(
        finishIntro,
        1900
    );

}


/* =====================================================
   FINISH INTRO
===================================================== */

function finishIntro(){

    encryptedScreen.style.display =
        "none";


    /*
        THIS IS WHERE YOUR
        EXISTING MINIGAME STARTS.

        We deliberately don't modify
        your gameplay here.
    */

    cinematic.style.display =
        "none";


    /*
        Replace this comment with
        your existing minigame's
        start function.

        Example:

        startGame();

        or

        document.getElementById("game")
            .style.display = "block";
    */

}


/* =====================================================
   RANDOM WINDOWS ARG GLITCHES
===================================================== */

let glitchTimer = null;


function startRandomGlitches(){

    const blocks = [

        document.getElementById("gb1"),
        document.getElementById("gb2"),
        document.getElementById("gb3"),
        document.getElementById("gb4"),
        document.getElementById("gb5")

    ];


    glitchTimer =
        setInterval(
            ()=>{

                const block =
                    blocks[
                        Math.floor(
                            Math.random() *
                            blocks.length
                        )
                    ];


                block.style.left =
                    Math.random()*100 + "%";

                block.style.top =
                    Math.random()*100 + "%";

                block.style.width =
                    Math.random()*35 + 5 + "%";

                block.style.height =
                    Math.random()*8 + 2 + "px";

                block.style.opacity =
                    Math.random()*.8 + .2;


                /*
                    Random red/white
                    corruption.
                */

                block.style.background =
                    Math.random() > .5
                    ? "#fff"
                    : "#ff0000";


                setTimeout(
                    ()=>{
                        block.style.opacity =
                            "0";
                    },
                    Math.random()*130 + 50
                );

            },
            90
        );

}


function stopRandomGlitches(){

    clearInterval(
        glitchTimer
    );


    document
        .querySelectorAll(".glitchBlock")
        .forEach(
            block=>{
                block.style.opacity =
                    "0";
            }
        );

}

</script>

</body>
</html>
